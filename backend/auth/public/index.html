<body><main><div class="wordmark"><span aria-hidden="true">V.</span> VisiDock</div><div class="eyebrow">YOUR PEOPLE. WITH YOU.</div><h1>One moment.</h1><p id="description">Checking your account link securely…</p><form id="action-form" hidden><div id="password-fields" hidden><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" maxlength="128"><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="128"></div><button type="submit">Continue</button></form><form id="recovery-form" hidden><label for="email-link">Have the link from your email?</label><p class="hint">Copy the full link from your latest VisiDock email and paste it here. It stays out of your browser history and is checked only with Firebase.</p><input id="email-link" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="8192" placeholder="https://visidock-thotapalli…" aria-label="Full VisiDock email link" required><button type="submit">Check my email link</button></form><p id="status" role="status" aria-live="polite"></p><footer>Your connections stay yours.<br>VisiDock · Private by design</footer></main><noscript>Enable JavaScript to securely verify your email or reset your password.</noscript></body></html>
